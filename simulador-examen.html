<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de examen</title>
<style>
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --ink:#1B2430; --muted:#5D6B7A; --line:#D5DBE2;
  --accent:#2F5BD3; --accent-ink:#FFFFFF; --sel:#E4EBFB;
  --ok:#1E8E5A; --ok-bg:#E3F4EC; --bad:#C8372D; --bad-bg:#FBE7E5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12171E; --card:#1B222C; --ink:#E6EAF0; --muted:#98A4B3; --line:#2E3845;
    --accent:#7C9CF0; --accent-ink:#0E1420; --sel:#25314A;
    --ok:#4CC38A; --ok-bg:#173327; --bad:#F0786E; --bad-bg:#3A1E1C;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:9rem}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(.75rem + env(safe-area-inset-top,0px)) 1rem .75rem}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:1.15rem;margin:0 0 .5rem;font-weight:650}
.stats{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;font-size:.92rem;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.stats .grade b{font-size:1.05rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin:.6rem 0 .7rem;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.tools{display:flex;flex-wrap:wrap;gap:.4rem}
button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:.4rem .8rem;border-radius:6px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible,select:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.on,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tools .sep{flex:1}
main{padding:1rem}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin:0 0 1rem}
.qhead{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.tag{font-weight:650;font-size:.85rem;color:var(--accent)}
.topicname{font-size:.82rem;color:var(--muted)}
.badge{font-size:.78rem;padding:.1rem .5rem;border-radius:999px;background:var(--sel);color:var(--ink)}
.text{white-space:pre-wrap;margin:0 0 .9rem}
.case{border:1px solid var(--line);border-radius:8px;margin:0 0 .9rem;background:var(--bg)}
.case summary{cursor:pointer;padding:.55rem .75rem;font-weight:600;font-size:.92rem;color:var(--accent)}
.case summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.case div{white-space:pre-line;padding:0 .75rem .75rem;font-size:.93rem;max-height:60vh;overflow:auto}
.opts{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.8rem}
.opt{display:flex;gap:.6rem;align-items:flex-start;text-align:left;width:100%;padding:.6rem .75rem;
  border:1.5px solid var(--line);border-radius:8px;background:transparent;font-size:.97rem;line-height:1.45}
.opt .l{font-weight:650;min-width:1.3rem}
.opt span:last-child{white-space:pre-wrap}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{opacity:1;cursor:default}
.slots{display:flex;flex-direction:column;gap:.7rem;margin-bottom:.8rem}
.slot label{display:block;font-size:.92rem;margin-bottom:.25rem;white-space:pre-line}
.slot select{width:100%;font:inherit;font-size:.95rem;padding:.45rem;border-radius:6px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.slot.ok select{border-color:var(--ok);background:var(--ok-bg)}
.slot.bad select{border-color:var(--bad);background:var(--bad-bg)}
.fix{font-size:.85rem;color:var(--ok);margin-top:.2rem}
.actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.verdict{font-weight:650;font-size:.92rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:2rem 0}
@media (max-width:560px){
  html{scroll-padding-top:12rem}
  .tools .sep{display:none}
  .q{padding:.9rem}
}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 id="title">Simulador de examen</h1>
    <div class="stats" aria-live="polite">
      <span>Respondidas <b id="sAns">0</b>/<b id="sTot">0</b></span>
      <span>Correctas <b id="sOk">0</b></span>
      <span>Falladas <b id="sBad">0</b></span>
      <span class="grade">Nota <b id="sPct">0%</b></span>
    </div>
    <div class="bar"><span id="bar"></span></div>
    <div class="tools" id="tools"></div>
  </div>
</header>
<main><div class="wrap" id="list"></div></main>

<script>
/**
 * Nombre que se muestra en el encabezado.
 * @type {string}
 */
const EXAM_NAME = "Simulador de examen AI-200";

/**
 * Nombre completo de cada Topic, tal como aparece en el sitio.
 * @type {Object<number,string>}
 */
const TOPICS = {
  1: "Topic 1, Develop containerized solutions on Azure",
  2: "Topic 2, Develop AI solutions by using Azure data management services",
  3: "Topic 3, Connect to and consume Azure services",
  4: "Topic 4, Secure, monitor, troubleshoot Azure solutions"
};

/**
 * Textos de casos de estudio compartidos entre varias preguntas.
 * Se muestran en un bloque plegable encima del enunciado.
 * @type {Object<string,string>}
 */
const CASES = {
  fabrikam: "This is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\n\nTo answer the case study questions, you will need to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\n\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\n\nTo start the case study\n\nTo display the first question in this case study, select the \"Next\" button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the \"Question\" button to return to the question.\n\nBackground\n\nFabrikam Inc. is a global retail analytics company that provides AI-driven demand forecasting and product recommendation services to online retailers. The company is modernizing its solution to run entirely on Microsoft Azure.\n\nThe platform ingests transaction data, generates embeddings for semantic retrieval, performs vector similarity search, and returns product recommendations through containerized microservices. Developers use Python and Azure SDKs. Operations teams manage container orchestration, scaling, monitoring, and security.\n\nThe solution must meet strict performance, scalability, and security requirements.\n\nCurrent environment\n\nApplication architecture\n\n• The Recommendation engine is a customer-facing HTTP API running as a containerized Python application. The engine is deployed to Azure Container Apps (ACA).\n• Embeddings are stored in Azure Database for PostgreSQL by using pgvector.\n• Semantic retrieval uses metadata filtering combined with vector similarity search.\n• Azure Managed Redis is used as a caching layer.\n• Front-end and API workloads are deployed to Azure Container Apps (ACA).\n• Batch model retraining workloads run in Azure Kubernetes Service (AKS).\n\nContainer and CI/CD\n\n• Container images are stored in Azure Container Registry (ACR).\n• CI/CD uses ACR Tasks to build images on commit.\n• ACA environments support revision management.\n• AKS workloads are deployed by using Kubernetes manifest files stored in Git.\n\nMonitoring\n\n• Logs are collected in Azure Monitor.\n• Teams inspect container logs and Kubernetes events when troubleshooting.\n• Developers write KQL queries to analyze latency spikes.\n\nBusiness requirements\n\nCustomer experience: Maintain a seamless, low-latency recommendation experience for end-users, even during unpredictable seasonal traffic spikes.\nOperational cost efficiency: Minimize compute expenditures by deallocating resources during periods of inactivity and by preventing runaway scaling costs.\nData integrity and freshness: Ensure that product recommendations always reflect the most current catalog metadata and pricing to prevent customer dissatisfaction.\nSecurity and compliance: Adhere to a Zero Trust security model by eliminating long-lived credentials and centralizing the management of all sensitive secrets.\nGlobal scalability: Support the rapid ingestion of millions of new product embeddings daily without degrading query performance for existing retailers.\n\nTechnical requirements\n\nPerformance: Semantic search latency must remain under 200 milliseconds at peak load.\nDatabase optimization: Use pgvector for embeddings and implement metadata filtering to reduce compute overhead. Configure compute and memory appropriately for vector workloads to ensure high-dimensional index residency in RAM and efficient mathematical throughput. Vector similarity calculations must be performed only against products that satisfy mandatory metadata constraints.\nDatabase performance: Database connections must support high concurrency with minimal latency through the implementation of connection optimization.\nData load strategy: To ensure maximum ingestion throughput, secondary indexes must be applied only after bulk loading of embeddings is complete.\nCaching: Redis cache entries must expire automatically after 10 minutes. Implement a reactive mechanism to invalidate cache entries upon metadata updates.\nIdentity: Use managed identities for all service-to-service and service-to-database authentication. Plain-text credentials in configuration files are strictly prohibited.\nSecret management: All secrets must be stored centrally. Secrets must be rotated automatically by using a centralized lifecycle policy.\nScaling: Use Kubernetes event-driven autoscaling (KEDA) for event-driven scaling. The Recommendation API must scale based on HTTP traffic, while batch jobs must scale based on queue length and support scale-to-zero.\nCI/CD: All images must be stored in Azure Container Registry. Use ACR Tasks to automate image builds triggered by source code commits.\nMonitoring: Use KQL to analyze performance telemetry and troubleshoot microservice connectivity failures. Inspect logs and events when troubleshooting AKS and ACA.",
  proseware: "This is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\n\nTo answer the case study questions, you will need to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\n\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\n\nTo start the case study\n\nTo display the first question in this case study, select the \"Next\" button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the \"Question\" button to return to the question.\n\nBackground\n\nProseware Inc. develops AI-powered knowledge management solutions for enterprise customers. The company is modernizing its platform to support semantic search, intelligent document retrieval, and real-time partner integrations.\n\nThe engineering team uses Python and Azure SDKs. The architecture is being redesigned to support containerized microservices, vector search workloads, and serverless backend processing.\n\nPlanned Application Architecture\n\n• Microservices are containerized by using Docker.\n• Code for containerized microservices and Azure Function apps is developed locally but stored in a GitHub repository.\n• Custom images for containerized microservices are stored in Azure Container Registry (ACR).\n• Base images are stored in Docker Hub. Custom images must be rebuilt automatically whenever their base images are updated.\n• Azure Cosmos DB for NoSQL stores documents, metadata, and vector embeddings.\n• Azure Functions generate vector embeddings of Azure Cosmos DB for NoSQL-hosted documents and send messages to Service Bus to trigger search index updates.\n• Azure Container Apps (ACA) apps host backend API services that provide semantic search across Azure Cosmos DB for NoSQL documents. API services process Service Bus messages and update search indexes.\n• Azure Kubernetes Service (AKS) processes batch vector embedding regeneration for existing Azure Cosmos DB for NoSQL documents (whenever the embedding model is changed).\n• An extranet-facing containerized webhook allows business partners to submit documents to be processed by internal AI workflows for semantic search and retrieval.\n\nMonitoring\n\n• Telemetry generated by Azure resources is sent to Azure Monitor.\n• A Log Analytics workspace is used to collect ACA apps logs, AKS container logs, and Azure Functions apps logs.\n• Monitoring of Azure Functions is currently implemented by using Azure Application Insights SDK instrumentation.\n\nBusiness Requirements\n\n• Embeddings for new or updated Azure Cosmos DB for NoSQL-hosted documents must be automatically generated.\n• Backend API services must scale automatically during business hours.\n• Cold start delay of backend APIs must be minimized.\n• Secrets must be stored outside of container images.\n• Developers must be able to correlate telemetry across Azure Functions hosts and apps.\n• All tracing must be implemented by using OpenTelemetry SDK instrumentation.\n• Development efforts must be minimized.\n\nTechnical Requirements\n\n• Container images must be built automatically and validated before code updates are merged into the main branch.\n• Image build automation must run inside the Azure Container Registry, eliminating dependency on local developer machines and external build services.\n• Dependency of image builds on local developer machines must be eliminated.\n• Event-driven scaling in ACA must occur based on the number of pending messages in the Azure Service Bus queue.\n• Azure Cosmos DB for NoSQL RU consumption must be minimized.\n• Vector similarity search must use embeddings stored in Azure Cosmos DB for NoSQL.\n• The partner-facing containerized webhook service must run on Azure App Service.\n• Secrets must NOT be stored in container images, source control, or application configuration directly. They must be accessed securely at runtime.\n• All secrets must be stored centrally in Azure Key Vault and accessed at runtime through a managed identity.\n• Azure App Service must supply secrets at runtime without relying on external services.\n• Resources and workloads must be deployed by using Bicep templates through an automated, version-controlled pipeline. Local and command-line deployments must be eliminated to ensure repeatable, auditable deployments.\n\nKnown Issues\n\n• RU consumption spikes during vector similarity queries."
};

/**
 * Banco de preguntas.
 * - type "mc": opción múltiple. `answer` es un arreglo de letras; si tiene más de una,
 *   la pregunta exige exactamente esa cantidad.
 * - `case` (opcional): clave de CASES con el texto del caso de estudio.
 * - type "dd": HOTSPOT / DRAG DROP convertido en desplegables. Cada `slot` tiene
 *   `label`, `options` (lista completa) y `answer` (texto exacto de la opción correcta).
 * @type {Array<Object>}
 */
const QUESTIONS = [
  {
    topic: 1, num: 1, type: "mc",
    text: "You maintain multiple versions of a container image in Azure Container Registry.\nThe production deployment must always run the exact same image build even if tags are changed later.\nYou need to ensure predictable and immutable image selection during deployment.\nWhat should you do?",
    options: {
      A: "Tag the image as production and deploy it by using the production tag.",
      B: "Schedule nightly rebuilds of the image.",
      C: "Configure deployment to use the latest tag.",
      D: "Identify the image by using its SHA digest."
    },
    answer: ["D"]
  },
  {
    topic: 1, num: 2, type: "mc",
    text: "A container in an AKS cluster repeatedly restarts.\nPod events show probe failures, although node-level CPU and memory metrics are normal.\nYou need to diagnose the cause of the repeating restarts.\nWhat should you do first?",
    options: {
      A: "Scale the deployment to more replicas.",
      B: "Decrease the initialDelaySeconds for the container liveness probe.",
      C: "Drain and reboot the node hosting the pod.",
      D: "Inspect the pod events and container logs."
    },
    answer: ["D"]
  },
  {
    topic: 1, num: 3, type: "mc",
    text: "You develop a message-processing service deployed to Azure Container Apps. The service reads messages from an Azure Service Bus queue.\nThe solution must minimize costs by ensuring NO compute resources are consumed when the queue is empty.\nYou need to configure scaling for the service.\nWhich two actions should you perform? Each correct answer presents part of the solution.\nNOTE: Each correct selection is worth one point.",
    options: {
      A: "Increase the scaling rule to allow for the maximum running replica count.",
      B: "Configure the scaling rule to allow for the termination of all active replicas.",
      C: "Configure a Kubernetes Event-driven Autoscaler rule that monitors queue length.",
      D: "Enable HTTP ingress concurrency scaling."
    },
    answer: ["B", "C"]
  },
  {
    topic: 1, num: 4, type: "mc",
    text: "You configure ACR Tasks to automate image builds.\nContainer images must rebuild when:\nApplication updates occur.\nBase image updates occur, such as when the underlying OS image is updated.\nRegular scheduled rebuilds are required.\nYou need to configure ACR Tasks to support automated image rebuilds.\nWhich three triggers should you configure? Each correct answer presents part of the solution.\nNOTE: Each correct selection is worth one point.",
    options: {
      A: "Timer trigger",
      B: "Source code commit trigger",
      C: "Registry event trigger",
      D: "Base image update trigger",
      E: "Webhook notification trigger"
    },
    answer: ["A", "B", "D"]
  },
  {
    topic: 1, num: 5, type: "dd", kind: "Ordenar",
    text: "DRAG DROP\nYou are developing several microservices to run on Azure Container Apps.\nThe microservices must allow HTTPS access by using a custom domain.\nYou need to configure the custom domain in Azure Container Apps.\nIn which order should you perform the actions? To answer, move all actions from the list of actions to the answer area and arrange them in the correct order.",
    slots: (() => {
      const acts = [
        "Add the custom domain name.",
        "Bind the certificate.",
        "Enable ingress.",
        "Validate the custom domain name.",
        "Add DNS records to the domain provider."
      ];
      return [
        "Enable ingress.",
        "Add DNS records to the domain provider.",
        "Validate the custom domain name.",
        "Add the custom domain name.",
        "Bind the certificate."
      ].map((a, k) => ({ label: String(k + 1), options: acts, answer: a }));
    })()
  },
  {
    topic: 1, num: 6, type: "mc",
    text: "You plan to deploy an Azure Container app.\n\nYou need to configure the container app to support session affinity.\n\nWhich ingress type and revision mode should you assign to the container app?",
    options: {
      A: "TCP ingress type and single revision mode",
      B: "TCP ingress type and multiple revision mode",
      C: "HTTP ingress type and multiple revision mode",
      D: "HTTP ingress type and single revision mode"
    },
    answer: ["D"]
  },
  {
    topic: 1, num: 7, type: "dd", kind: "Desplegables",
    text: "DRAG DROP\n\nYou deploy an API to Azure Container Apps.\n\nThe solution must provide the following functionality:\n\n• Support the concurrent activation of multiple application versions.\n• Allocate a specific percentage of incoming requests to a secondary version.\n\nYou need to configure revision behavior.\n\nWhich configurations should you use? To answer, move the appropriate configurations to the correct requirements. You may use each configuration once, more than once, or not at all. You may need to move the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.\n\nRevision management and traffic routing in Azure Container Apps",
    slots: (() => {
      const cfg = ["Traffic splitting", "Single revision mode", "Traffic isolation", "Multiple revision mode"];
      return [
        { label: "Test a new revision without affecting production traffic.", options: cfg, answer: "Multiple revision mode" },
        { label: "Route 20 percent of traffic to a new revision.", options: cfg, answer: "Traffic splitting" }
      ];
    })()
  },
  {
    topic: 1, num: 8, type: "dd", kind: "Ordenar",
    text: "DRAG DROP\n\nYou plan to create a Docker image that runs an ASP.NET Core application named ContosoApp. You have a setup script named setupScript.ps1 and a series of application files including ContosoApp.dll.\n\nYou need to create a Dockerfile document that meets the following requirements:\n\n• Call setupScript.ps1 when the container is built.\n• Run ContosoApp.dll when the container starts.\n\nThe Dockerfile document must be created in the same folder where ContosoApp.dll and setupScript.ps1 are stored.\n\nWhich five commands should you use to develop the solution? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.",
    slots: (() => {
      const cmds = [
        'CMD ["dotnet", "ContosoApp.dll"]',
        "COPY ./ .",
        "FROM microsoft/aspnetcore:latest",
        "RUN powershell ./setupScript.ps1",
        "WORKDIR /apps/ContosoApp"
      ];
      return [
        "FROM microsoft/aspnetcore:latest",
        "WORKDIR /apps/ContosoApp",
        "COPY ./ .",
        "RUN powershell ./setupScript.ps1",
        'CMD ["dotnet", "ContosoApp.dll"]'
      ].map((a, k) => ({ label: String(k + 1), options: cmds, answer: a }));
    })()
  },
  {
    topic: 1, num: 9, type: "dd", kind: "Desplegables",
    text: "DRAG DROP\n\nYou are preparing a container image for deployment to production.\n\nThe container image build and deployment process must ensure the following:\n\n• The image is uniquely versioned.\n• Secure authentication is used when pushing the image to Azure Container Registry (ACR).\n• The image is stored in ACR for deployment.\n\nYou need to ensure that the container image build-and-push process meets the requirements.\n\nWhich action should you perform for each requirement? To answer, move the appropriate actions to the correct requirements. You may use each action once, more than once, or not at all. You may need to move the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.\n\nACR image management",
    slots: (() => {
      const acts = [
        "Build the image locally.",
        "Push the image to ACR.",
        "Use a unique tag for the image.",
        "Authenticate to ACR by using Microsoft Entra ID."
      ];
      return [
        { label: "Ensure that the image is versioned.", options: acts, answer: "Use a unique tag for the image." },
        { label: "Allow secure push to ACR.", options: acts, answer: "Authenticate to ACR by using Microsoft Entra ID." },
        { label: "Store the image in the registry for deployment.", options: acts, answer: "Push the image to ACR." }
      ];
    })()
  },
  {
    topic: 1, num: 10, type: "dd", kind: "Desplegables",
    text: "DRAG DROP\n\nYou plan to deploy a web application to AKS.\n\nThe solution must:\n\n• Scale out the application by adding more pods during peak CPU usage.\n• Expose the application internally within the cluster only.\n\nYou need to configure a Kubernetes resource for each requirement.\n\nWhich resources should you configure? To answer, move the appropriate resources to the correct requirements. You may use each resource once, more than once, or not at all. You may need to move the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.\n\nMap Kubernetes resources to scaling and internal networking requirements",
    slots: (() => {
      const res = ["Ingress", "Deployment", "ClusterIP service", "VerticalPodAutoscaler", "HorizontalPodAutoscaler"];
      return [
        { label: "Scale out the application.", options: res, answer: "HorizontalPodAutoscaler" },
        { label: "Expose the application internally only.", options: res, answer: "ClusterIP service" }
      ];
    })()
  },
  {
    topic: 1, num: 11, type: "mc",
    text: "You deploy a new revision of an app in ACA.\n\nYou need to gradually shift production traffic to the revision while monitoring performance. In addition, you need to be able to quickly roll back.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.\n\nNOTE: Each correct selection is worth one point.",
    options: {
      A: "Use single revision mode.",
      B: "Restart the revision.",
      C: "Enable multiple revision mode.",
      D: "Increase replica count.",
      E: "Use traffic splitting."
    },
    answer: ["C", "E"]
  },
  {
    topic: 1, num: 12, type: "dd", kind: "Desplegables",
    text: "HOTSPOT\n\nYou plan to deploy an Azure Container Apps app named App1. App1 will use an access key to connect to a backend API.\n\nThe solution must store the key outside of the App1 environment and minimize maintenance efforts.\n\nYou need to configure secure key storage for App1.\n\nWhich configurations should you use? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.\n\nSecret configuration in Azure Container Apps",
    slots: [
      { label: "Provide the key storage for App1.",
        options: ["Azure Key Vault key", "Azure Key Vault secret", "Azure Container Apps secret"],
        answer: "Azure Key Vault secret" },
      { label: "Secure App1 access to the key storage.",
        options: ["Service principal", "Managed identity", "Workload identity"],
        answer: "Managed identity" }
    ]
  },
  {
    topic: 1, num: 13, type: "mc",
    text: "You have container source code stored in a Git repository.\n\nThe container registry must automatically build and store a new container image whenever a developer commits code to the Git repository.\n\nYou must minimize the use of an external build infrastructure.\n\nYou need to configure Azure Container Registry (ACR) to manage the build process natively and automatically.\n\nWhich two ACR components should you use? Each correct answer presents part of the solution.\n\nNOTE: Each correct selection is worth one point.",
    options: {
      A: "Webhook",
      B: "Quick task",
      C: "Artifact Cache rule",
      D: "Source-triggered task"
    },
    answer: ["B", "D"]
  },
  {
    topic: 1, num: 14, type: "dd", kind: "Ordenar",
    text: "DRAG DROP\n\nYou have an existing AKS cluster and a container image stored in Azure Container Registry.\n\nYou must deploy a new version without interrupting traffic.\n\nYou need to perform a rolling update by using a manifest file.\n\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.\n\nRolling updates in Azure Kubernetes Service using deployment manifests",
    slots: (() => {
      const acts = [
        "Apply the updated manifest.",
        "Update the image tag in the deployment manifest.",
        "Verify rollout status.",
        "Delete the existing deployment and recreate it.",

/* ---------- Estado en memoria (sin almacenamiento del navegador) ---------- */
const state = {
  filter: "all",
  order: QUESTIONS.map((_, i) => i),
  /** @type {Object<number,{sel:Array,result:(null|boolean)}>} */
  q: {}
};

/** Reinicia el estado de todas las preguntas. */
function resetState() {
  state.q = {};
  QUESTIONS.forEach((q, i) => {
    state.q[i] = { sel: q.type === "dd" ? q.slots.map(() => "") : [], result: null };
  });
}

/** Devuelve los índices visibles según el filtro y el orden actual. */
function visible() {
  return state.order.filter(i => state.filter === "all" || QUESTIONS[i].topic === state.filter);
}

/** Actualiza marcador y barra de progreso sobre las preguntas visibles. */
function updateStats() {
  const vis = visible();
  let ans = 0, ok = 0;
  vis.forEach(i => { const r = state.q[i].result; if (r !== null) { ans++; if (r) ok++; } });
  document.getElementById("sAns").textContent = ans;
  document.getElementById("sTot").textContent = vis.length;
  document.getElementById("sOk").textContent = ok;
  document.getElementById("sBad").textContent = ans - ok;
  document.getElementById("sPct").textContent = ans ? Math.round(ok * 100 / ans) + "%" : "0%";
  document.getElementById("bar").style.width = vis.length ? (ans * 100 / vis.length) + "%" : "0";
}

/** Crea un elemento con clase y texto opcionales. */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

/** Dibuja la barra de filtros y acciones globales. */
function renderTools() {
  const t = document.getElementById("tools");
  t.innerHTML = "";
  const mk = (label, val, tip) => {
    const b = el("button", state.filter === val ? "on" : "", label);
    b.setAttribute("aria-pressed", state.filter === val);
    if (tip) b.title = tip;
    b.onclick = () => { state.filter = val; renderTools(); renderList(); };
    t.appendChild(b);
  };
  mk("Todos", "all");
  Object.keys(TOPICS).map(Number).sort((a, b) => a - b)
    .forEach(n => mk("Topic " + n, n, TOPICS[n]));
  t.appendChild(el("span", "sep"));
  const shuffle = el("button", "", "Mezclar");
  shuffle.onclick = () => {
    const a = state.order;
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    renderList();
  };
  const reset = el("button", "", "Reiniciar");
  reset.onclick = () => {
    if (!confirm("¿Borrar todas las respuestas y volver al orden original?")) return;
    state.order = QUESTIONS.map((_, i) => i);
    resetState(); renderList(); window.scrollTo(0, 0);
  };
  t.append(shuffle, reset);
}

/** Dibuja la lista de tarjetas visibles. */
function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const vis = visible();
  if (!vis.length) list.appendChild(el("p", "empty", "No hay preguntas en este Topic todavía."));
  vis.forEach(i => list.appendChild(renderCard(i)));
  updateStats();
}

/**
 * Construye la tarjeta de una pregunta.
 * @param {number} i índice en QUESTIONS
 * @returns {HTMLElement}
 */
function renderCard(i) {
  const q = QUESTIONS[i], st = state.q[i], done = st.result !== null;
  const card = el("article", "q");
  const head = el("div", "qhead");
  head.appendChild(el("span", "tag", "T" + q.topic + " · #" + q.num));
  head.appendChild(el("span", "topicname", TOPICS[q.topic] || ""));
  const need = q.type === "mc" ? q.answer.length : 0;
  if (need > 1) head.appendChild(el("span", "badge", "elige " + need));
  if (q.type === "dd") head.appendChild(el("span", "badge", q.kind || "Desplegables"));
  card.appendChild(head);
  if (q.case && CASES[q.case]) {
    const det = document.createElement("details");
    det.className = "case";
    det.append(el("summary", "", "Ver caso de estudio"), el("div", "", CASES[q.case]));
    card.appendChild(det);
  }
  card.appendChild(el("p", "text", q.text));

  const check = el("button", "primary", "Comprobar");
  const clear = el("button", "", "Limpiar");
  const verdict = el("span", "verdict");

  if (q.type === "mc") {
    const box = el("div", "opts");
    Object.entries(q.options).forEach(([k, v]) => {
      const b = el("button", "opt");
      b.append(el("span", "l", k + "."), el("span", "", v));
      b.disabled = done;
      if (done) {
        if (q.answer.includes(k)) b.classList.add("ok");
        else if (st.sel.includes(k)) b.classList.add("bad");
      } else if (st.sel.includes(k)) b.classList.add("sel");
      b.setAttribute("aria-pressed", st.sel.includes(k));
      b.onclick = () => {
        if (need > 1) {
          const p = st.sel.indexOf(k);
          if (p >= 0) st.sel.splice(p, 1);
          else if (st.sel.length < need) st.sel.push(k);
        } else st.sel = st.sel[0] === k ? [] : [k];
        card.replaceWith(renderCard(i));
      };
      box.appendChild(b);
    });
    card.appendChild(box);
    check.disabled = done || st.sel.length !== need;
    check.onclick = () => {
      st.result = st.sel.length === need && st.sel.every(k => q.answer.includes(k));
      card.replaceWith(renderCard(i)); updateStats();
    };
  } else {
    const box = el("div", "slots");
    q.slots.forEach((s, si) => {
      const wrap = el("div", "slot");
      const id = "s" + i + "_" + si;
      const lab = el("label", "", s.label); lab.htmlFor = id;
      const sel = document.createElement("select"); sel.id = id; sel.disabled = done;
      sel.appendChild(new Option("— Selecciona —", ""));
      s.options.forEach(o => sel.appendChild(new Option(o, o)));
      sel.value = st.sel[si];
      sel.onchange = () => { st.sel[si] = sel.value; check.disabled = st.sel.some(v => !v); };
      wrap.append(lab, sel);
      if (done) {
        const good = st.sel[si] === s.answer;
        wrap.classList.add(good ? "ok" : "bad");
        if (!good) wrap.appendChild(el("div", "fix", "Correcta: " + s.answer));
      }
      box.appendChild(wrap);
    });
    card.appendChild(box);
    check.disabled = done || st.sel.some(v => !v);
    check.onclick = () => {
      st.result = q.slots.every((s, si) => st.sel[si] === s.answer);
      card.replaceWith(renderCard(i)); updateStats();
    };
  }

  clear.disabled = !done && (q.type === "mc" ? !st.sel.length : st.sel.every(v => !v));
  clear.onclick = () => {
    state.q[i] = { sel: q.type === "dd" ? q.slots.map(() => "") : [], result: null };
    card.replaceWith(renderCard(i)); updateStats();
  };
  if (done) {
    verdict.textContent = st.result ? "Correcta" : "Incorrecta";
    verdict.classList.add(st.result ? "ok" : "bad");
  }
  const act = el("div", "actions");
  act.append(check, clear, verdict);
  card.appendChild(act);
  return card;
}

document.getElementById("title").textContent = EXAM_NAME;
document.title = EXAM_NAME;
resetState(); renderTools(); renderList();
</script>
